# Runs on every pull request. A release (a pull request from main into release) also has its version
# checked, again in the merge queue, so two releases raising to the same version can't both land.
name: ci

on:
  pull_request:
  merge_group:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the version check compares with the base
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
      - name: The version is right for this release
        if: github.base_ref == 'release' || github.event_name == 'merge_group'
        run: node scripts/check-version.mjs "$BASE"
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
