# Runs on every pull request, and again in the merge queue on the pull request combined with main
# and the pull requests ahead of it, so what lands on main is what passed. The queue is what stops
# two changes raising to the same version from both landing (scripts/check-version.mjs).
name: ci

on:
  pull_request:
  merge_group:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the version check compares with the base
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
      - name: The version is right for this change
        run: node scripts/check-version.mjs "$BASE"
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
